# Single CodeBuild spec for Envoy, main-service, and notification-service.
#
# ECR private repos (ap-southeast-1, account 017263836577) — push targets:
#   017263836577.dkr.ecr.ap-southeast-1.amazonaws.com/envoy-proxy
#   017263836577.dkr.ecr.ap-southeast-1.amazonaws.com/main-service
#   017263836577.dkr.ecr.ap-southeast-1.amazonaws.com/notification-service
#
# Control behavior via environment variables (set in this file or in the CodeBuild project):
#   (default)           — scripts decide from git diff (HEAD~1 or origin/<branch>...HEAD if shallow clone)
#   TASKFLOW_DIFF_BASE_BRANCH — branch name for fetch/diff when HEAD~1 missing (default: develop)
#   FORCE_FULL_BUILD=1  — always build and push all three images
#   CODEBUILD_SERVICES  — force subset: "all", or one/more of envoy, main, notification (comma-separated)
# Optional overrides: ECR_REPO_ENVOY, ECR_REPO_MAIN, ECR_REPO_NOTIFICATION (must match repo names in ECR)
#
version: 0.2

env:
  variables:
    AWS_REGION: ap-southeast-1
    AWS_ACCOUNT_ID: "017263836577"
  exported-variables:
    - BUILD_ENVOY
    - BUILD_MAIN
    - BUILD_NOTI

phases:
  install:
    commands:
      - command -v jq >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq jq)
  pre_build:
    commands:
      - bash scripts/codebuild-prepare.sh
      # Export BUILD_* vars into the CodeBuild shell so CodePipeline can read them
      - source /tmp/taskflow-build.env
  build:
    commands:
      - bash scripts/codebuild-build.sh
  post_build:
    commands:
      - bash scripts/codebuild-post-build.sh

artifacts:
  files:
    - imagedefinitions.json
