services:
  envoy:
    env_file:
      - .env
    # Linux dev: share host network so Envoy reaches dotnet/nest on 127.0.0.1:5001/5002.
    # (host.docker.internal often cannot reach published host ports from the bridge network.)
    network_mode: host
    networks: !reset []

  grpc-service:
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5001:5001"

  notification-service:
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    ports:
      - "5002:5002"

  zookeeper:
    ports:
      - "2181:2181"

  kafka:
    ports:
      - "29092:29092"

  kafka-ui:
    ports:
      - "8888:8888"

  redis:
    ports:
      - "6379:6379"

  elasticsearch:
    ports:
      - "9200:9200"

  kibana:
    ports:
      - "5601:5601"
