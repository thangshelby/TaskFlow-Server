admin:
  access_log_path: "/tmp/admin_access.log"
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    - name: listener_http
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: AUTO
                stat_prefix: grpc_json_transcoder
                route_config:
                  virtual_hosts:
                    - name: grpc_services
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: ""
                          route:
                            cluster: grpc_service
                          decorator:
                            operation: "transcoding"
                http_filters:
                - name: envoy.filters.http.jwt_authn
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                    providers:
                      my_jwt_provider:
                        issuer: "127.0.0.1"
                        local_jwks:
                          inline_string: |
                            {
                              "keys": [
                                {
                                  "kty": "RSA",
                                  "alg": "RS256",
                                  "use": "sig",
                                  "n": "sqeJGov8nTaxpcqKnjOlt2_6YgBdm9vPX67brfmEY--M4mn7Tbt_Q76hDk44CvLvFll7amwO763rA5m9mQDTgmK57_E7zaF4T2A2B0xqg8V_f6EG5G9lBmtwqHX4mDW8B4ZKXX9KYzVK6wndoJsRu1rq1FmZMeapDpjXL1Rb0DVP9ZPxnvGDhVBxA83lzUhIRBX3_2CwrCrET9nCEDOAer7U9xKz-oVbXyuCvUwYCJPN02gOV_sBjHrW2T09bEsUW6s-vLspv9AVC5sjYduhAVrqmh1RGhZOPziwwa1DmvO5z_qEdDawSOki7dU8zxZQ5cX18BzkXZjuwhjQYP9vlw",
                                  "e": "AQAB"
                                }
                              ]
                            }
                        forward: true  
                    rules:
                      - match:
                          prefix: ""
                        requires:
                          provider_name: "my_jwt_provider"
                - name: envoy.filters.http.rbac
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                    rules:
                      action: ALLOW
                      policies:

                        # Policy for users with role "user_role" accessing /api/v1/users/login
                        user_access:
                          permissions:
                            # - and_rules:
                            #     rules:
                            #       - header:
                            #           name: ":path"
                            #           exact_match: "/api/v1/users/login"
                            - any: true
                          principals:
                              - metadata:
                                  filter: envoy.filters.http.jwt_authn
                                  path:
                                    - key: jwt
                                    - key: claims
                                    - key: role
                                  value:
                                    string_match:
                                      exact: "user_role"

                        # Policy for admins accessing /api/v1/user with POST method
                        # admin_access:
                        #   permissions:
                        #     - and_rules:
                        #         rules:
                        #           - header:
                        #               name: ":path"
                        #               exact_match: "/api/v1/users"
                        #           - header:
                        #               name: ":method"
                        #               exact_match: "POST"
                        #   principals:
                        #       - metadata:
                        #           filter: envoy.filters.http.jwt_authn
                        #           path:
                        #             - key: jwt
                        #             - key: claims
                        #             - key: role
                        #           value:
                        #             string_match:
                        #               exact: "admin_role"
                - name: envoy.filters.http.grpc_json_transcoder
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_json_transcoder.v3.GrpcJsonTranscoder
                    proto_descriptor: "/etc/envoy/proto.pb"
                    services: ["project_service.UserService"]
                    convert_grpc_status: true
                - name: envoy.filters.http.router
                  typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                
  clusters:
    - name: grpc_service
      type: LOGICAL_DNS
      connect_timeout: 5s
      lb_policy: ROUND_ROBIN
      http2_protocol_options: {}
      load_assignment:
        cluster_name: grpc_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1  # Connects to your local machine
                      port_value: 5001  # Your local gRPC server port
