admin:
  access_log_path: "/tmp/admin_access.log"
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    - name: listener_http
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: AUTO
                stat_prefix: grpc_json_transcoder
                route_config:
                  virtual_hosts:
                    - name: grpc_services
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: ""
                          route:
                            cluster: grpc_service
                          decorator:
                            operation: "transcoding"
                      typed_per_filter_config:
                        envoy.filters.http.cors:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                          allow_origin_string_match:
                            - prefix: "http://localhost:5173"
                            - prefix: "https://yourfrontend.com"
                          allow_methods: "GET, POST, PUT, DELETE, OPTIONS"
                          allow_headers: "content-type, authorization"
                          expose_headers: "x-custom-header"
                          max_age: "86400"
                          allow_credentials: true
                http_filters:
                - name: envoy.filters.http.cors
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                - name: envoy.filters.http.jwt_authn
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                    providers:
                      my_jwt_provider:
                        issuer: "127.0.0.1"
                        local_jwks:
                          inline_string: |
                            {
                              "keys": [
                                {
                                  "kty": "RSA",
                                  "alg": "RS256",
                                  "use": "sig",
                                  "n": "sqeJGov8nTaxpcqKnjOlt2_6YgBdm9vPX67brfmEY--M4mn7Tbt_Q76hDk44CvLvFll7amwO763rA5m9mQDTgmK57_E7zaF4T2A2B0xqg8V_f6EG5G9lBmtwqHX4mDW8B4ZKXX9KYzVK6wndoJsRu1rq1FmZMeapDpjXL1Rb0DVP9ZPxnvGDhVBxA83lzUhIRBX3_2CwrCrET9nCEDOAer7U9xKz-oVbXyuCvUwYCJPN02gOV_sBjHrW2T09bEsUW6s-vLspv9AVC5sjYduhAVrqmh1RGhZOPziwwa1DmvO5z_qEdDawSOki7dU8zxZQ5cX18BzkXZjuwhjQYP9vlw",
                                  "e": "AQAB"
                                }
                              ]
                            }
                        forward: true
                        payload_in_metadata: "jwt_payload"
                        from_cookies:
                          - token   
                    rules:
                      # Public route
                      - match:
                          path: "/api/v1/users/login"
                          headers:
                            - name: ":method"
                              string_match:
                                exact: "POST"
                        requires: {}

                      - match:
                          path: "/api/v1/users"
                          headers:
                            - name: ":method"
                              string_match:
                                exact: "POST"
                        requires: {}
                           
                      # Private route
                      - match:
                          prefix: "/"
                        requires:
                          provider_name: "my_jwt_provider"
                - name: envoy.filters.http.rbac
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                    rules:
                      action: ALLOW
                      policies:
                        "all-access-policy":
                          permissions:
                            - any: true
                          principals:
                            - any: true
                        # "user-login-policy":
                        #   permissions:
                        #     - and_rules:
                        #         rules:
                        #           - header:
                        #               name: ":method"
                        #               string_match:
                        #                 exact: "POST"
                        #           - url_path:
                        #               path:
                        #                 prefix: "/api/v1/users/login"
                        #   principals:
                        #     - metadata:
                        #         filter: "envoy.filters.http.jwt_authn"
                        #         path: 
                        #           - key: "jwt_payload"  
                        #           - key: "role" 
                        #         value:
                        #           string_match:
                        #             exact: "user_role"
                - name: envoy.filters.http.lua
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                    inline_code: |
                      function envoy_on_response(response_handle)
                        local token = response_handle:headers():get("authorization")
                        if token then
                          response_handle:headers():add("Set-Cookie", "token=" .. token .. "; Path=/; HttpOnly; Secure; SameSite=None")
                        end
                      end
                - name: envoy.filters.http.grpc_json_transcoder
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_json_transcoder.v3.GrpcJsonTranscoder
                    proto_descriptor: "/etc/envoy/proto.pb"
                    services: ["project_service.UserService", "project_service.SprintService" , "project_service.ProjectService","project_service.IssueService"]
                    convert_grpc_status: true
                    print_options:
                      always_print_primitive_fields: true
                      preserve_proto_field_names: true
                    
                - name: envoy.filters.http.router
                  typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                
  clusters:
    - name: grpc_service
      type: LOGICAL_DNS
      connect_timeout: 5s
      lb_policy: ROUND_ROBIN
      http2_protocol_options: {}
      load_assignment:
        cluster_name: grpc_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1  # Connects to your local machine
                      port_value: 5001  # Your local gRPC server port
