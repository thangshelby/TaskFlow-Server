---
    name: Build and Push Main Service Image to AWS ECR
    on:
      push:
        branches: [ taskflow/deploy ]
    jobs:
      build-and-push:
        name: Build and Push to ECR
        runs-on: ubuntu-latest
        steps:
        - name: Checkout
          uses: actions/checkout@v2
    
        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v1
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ secrets.AWS_REGION }}
    
        - name: Login to Amazon ECR
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v1
    
        # - name: Automatic Tagging of Releases
        #   id: increment-git-tag
        #   run: |
        #     bash ./build/git_update.sh -v major
    
        - name: Build, Tag, and Push the Image to Amazon ECR
          id: build-image
          env:
            ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            ECR_REPOSITORY: main-service
            IMAGE_TAG: latest
            # Đưa các secret vào môi trường của step này để docker build có thể đọc
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            REDIS_CONNECTIONSTRING: ${{ secrets.REDIS_CONNECTIONSTRING }}
          run: |
            docker build \
              --build-arg AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID \
              --build-arg AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY \
              --build-arg REDIS_CONNECTIONSTRING=$REDIS_CONNECTIONSTRING \
              -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
              -f services/main-service/Dockerfile .
            echo "Built image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
            echo "Pushing image to ECR..."
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
            echo "Pushed image to ECR: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"