version: "3.8"
services:
  envoy:
    image: envoyproxy/envoy:v1.33.0
    container_name: envoy_proxy
    ports:
      - "8081:8081" # HTTP (REST to gRPC)
      - "8082:8082" # HTTP (REST to gRPC)
      - "9901:9901" # Admin Panel
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml
      - ./proto.pb:/etc/envoy/proto.pb
      - ./notification.pb:/etc/envoy/notification.pb
    networks:
      - taskflow-network
    # depends_on:
    #   - grpc-server
  # grpc-server:
  #   build:
  #     context: ./services/main-service # Path to your .NET project
  #     dockerfile: Dockerfile
  #   container_name: grpc_server
  #   ports:
  #     - "5001:5001" # Map host port 5001 to container port 5001
  #   networks:
  #     - taskflow-network
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Development
  #     - ASPNETCORE_URLS=http://0.0.0.0:5001
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3
  kafka:
    image: bitnami/kafka:3.8
    container_name: kafka
    ports:
      - "9092:9092" # External access
      - "9094:9094" # Internal access
      - "9093:9093" # Controller
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      # Define multiple listeners: INTERNAL for Docker network, EXTERNAL for host access
      - KAFKA_CFG_LISTENERS=INTERNAL://:9094,EXTERNAL://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      # Advertise different addresses for internal vs external clients
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka:9094,EXTERNAL://localhost:9092
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_BROKER_ID=1
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka-data:/bitnami/kafka
    networks:
      - taskflow-network
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui
    ports:
      - "8888:8888"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9094 # Use internal port
      - SERVER_PORT=8888
    depends_on:
      - kafka
    networks:
      - taskflow-network
  cassandra:
    image: cassandra:5.0.4
    container_name: cassandra
    environment:
      - CASSANDRA_CLUSTER_NAME=my-cluster
      - CASSANDRA_BROADCAST_ADDRESS=auto
      - CASSANDRA_LISTEN_ADDRESS=auto
    ports:
      - "9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    networks:
      - taskflow-network
  cassandra-init:
    image: cassandra:5.0.4
    depends_on:
      - cassandra
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      echo '⏳ Waiting for Cassandra to be available...' &&
      while ! cqlsh cassandra -e 'describe keyspaces'; do sleep 2; done &&
      echo '✅ Cassandra is up!' &&
      cqlsh cassandra -e \"
        CREATE KEYSPACE IF NOT EXISTS taskflow
        WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};
      \"
      "
    networks:
      - taskflow-network
  kafka-topic-creator:
    image: bitnami/kafka:3.8
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      echo '⏳ Waiting for Kafka to be available...' &&
      while ! kafka-topics.sh --bootstrap-server kafka:9094 --list; do sleep 2; done &&
      echo '✅ Kafka is up!' &&
      kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists --topic activities --partitions 3 --replication-factor 1 && 
      kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists --topic notification --partitions 3 --replication-factor 1
      "
    networks:
      - taskflow-network
networks:
  taskflow-network:
    driver: bridge
volumes:
  esdata: {}
  kong-data: {}
  kafka-data: {}
  cassandra-data: {}
