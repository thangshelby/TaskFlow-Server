syntax = "proto3";

option csharp_namespace = "TaskFlow.UserService";

package project_service;

message CreateUserReq {
  string firstName = 1;
  string lastName = 2;
  string email = 3;
  string password = 4;
  string role = 5;
}

// Define response message
message CreateUserRes {
  string status = 1;
  UserRes data = 2;
}
message UserRes{
    string first_name = 1;
    string last_name = 2;
    string email = 3;
    string role = 4;
    string created_at = 5;
    string updated_at = 6;
}
  