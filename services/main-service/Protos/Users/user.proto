syntax = "proto3";

option csharp_namespace = "TaskFlow.UserService";

package project_service;

import "google/protobuf/empty.proto";
import "google/api/annotations.proto"; // Import Google API annotations

// Define the gRPC service
service UserService {
  rpc CreateUser (CreateUserReq) returns (CreateUserRes) {
    option (google.api.http) = {
      post: "/api/v1/users"
      body: "*"
    };
  }
  rpc Login (LoginUserReq) returns (LoginUserRes) {
    option (google.api.http) = {
      post: "/api/v1/users/login"
      body: "*"
    };
  }
  rpc Register (RegisterUserReq) returns (CreateUserRes) {
    option (google.api.http) = {
      post: "/api/v1/users/register"
      body: "*"
    };
  }
  rpc UpdateUser (UpdateUserReq) returns (UpdateUserRes) {
    option (google.api.http) = {
      put: "/api/v1/users"
      body: "*"
    };
  }
  rpc GetById (GetUserReq) returns (GetUserRes) {
    option (google.api.http) = {
      get: "/api/v1/users/{user_id}"
      body: "*"
    };
  }
  rpc GetMe (GetUserReq) returns (GetUserRes) {
    option (google.api.http) = {
      get: "/api/v1/users/get-me"
      body: "*"
    };
  }
}

// LOGIN
message LoginUserReq {
  string email = 1;
  string password = 2;
}

message LoginUserRes {
  string status = 1;
  string message = 2;
  UserRes data = 3;
}

// Get one user
message GetUserReq {
  string user_id = 1;
}

message GetUserRes {
  string status = 1;
  UserRes data = 2;
}

// Update User
message UpdateUserReq {
  string user_id = 1;
  optional string first_name = 2;
  optional string last_name = 3;
  optional string email = 4;
  optional string password = 5;
  optional string role = 6;
}

message UpdateUserRes {
  string status = 1;
  UserRes data = 2;
}

// Create User
message CreateUserReq {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
  string password = 4;
  string role = 5;
}

message CreateUserRes {
  string status = 1;
  UserRes data = 2;
}

// Register User
message RegisterUserReq {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
  string password = 4;
  string password_confirm = 5;
}


// Common
message UserRes{
    string first_name = 1;
    string last_name = 2;
    string email = 3;
    string role = 4;
    string created_at = 5;
    string updated_at = 6;
}
  